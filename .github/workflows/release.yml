name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18
          registry-url: 'https://npm.pkg.github.com'
          scope: '@trokky'

      - name: Configure npm for GitHub Packages
        run: |
          echo "@trokky:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Packages
        run: npm run build

      - name: Publish All Packages
        run: |
          # Publish in dependency order, continue on error
          npm publish --workspace packages/fields || true
          npm publish --workspace packages/core || true
          npm publish --workspace packages/routes || true
          npm publish --workspace packages/structure || true
          npm publish --workspace packages/client || true
          npm publish --workspace packages/adapters/filesystem || true
          npm publish --workspace packages/adapters/filesystem-data || true
          npm publish --workspace packages/adapters/filesystem-media || true
          npm publish --workspace packages/studio || true
          npm publish --workspace packages/integrations/express || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release Pull Request
        id: changesets
        uses: changesets/action@v1
        with:
          publish: echo "Packages published in previous step"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
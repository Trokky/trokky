name: Publish Packages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'examples/**'
      - '**.md'
      - '.gitignore'
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          # Force install rollup platform-specific binary
          cd packages/studio && npm install @rollup/rollup-linux-x64-gnu --save-dev
      
      - name: Type check
        run: npm run type-check
      
      - name: Run tests
        run: npm run test
      
      - name: Build packages
        run: npm run build

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@trokky'
      
      - name: Install dependencies
        run: |
          npm ci
          # Force install rollup platform-specific binary
          cd packages/studio && npm install @rollup/rollup-linux-x64-gnu --save-dev
      
      - name: Build packages
        run: npm run build
      
      - name: Configure packages for GitHub Packages
        run: |
          find packages -name "package.json" -not -path "*/node_modules/*" | xargs -I {} bash -c '
            if [ -f "{}" ]; then
              echo "Configuring {}"
              # Add publishConfig to package.json if not present
              cat "{}" | jq ".publishConfig = {\"registry\": \"https://npm.pkg.github.com\", \"access\": \"restricted\"}" > "{}.tmp" && mv "{}.tmp" "{}"
            fi
          '
      
      - name: Publish to GitHub Packages
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
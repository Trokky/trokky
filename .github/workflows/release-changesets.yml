name: Changesets Release

# The only workflow that publishes to npm. npm trusts exactly one workflow file per package for
# trusted publishing, so recovery is a re-run or a manual dispatch of this one, not a second
# publishing workflow. Each package's trusted publisher on npmjs.com must name
# Trokky/trokky and `release-changesets.yml`.
on:
  push:
    branches:
      - main
  # Recovery: re-publishes whatever is versioned but not yet on the registry. Safe to run any
  # time; versions already published are skipped.
  workflow_dispatch:

concurrency:
  # One registry, so one publish at a time from anywhere, whatever ref triggered it.
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Trusted publishing: npm exchanges this short-lived OIDC token for publish rights, so no
  # long-lived NPM_TOKEN exists to leak, expire or rotate. The 3.5.1 release first failed on
  # exactly that: an expired token, rejected with E404 on every package.
  id-token: write

jobs:
  release:
    name: Release
    # The trusted publisher does not restrict branches, so this does: a dispatch from another
    # branch must not publish unreviewed versions.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      # Node 22 ships npm 10. Trusted publishing needs 11.5.1 or later, and an older npm
      # silently falls back to looking for a token.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install Dependencies
        run: npm ci

      - name: Build Packages
        run: npm run build

      # With pending changesets this opens or updates the release PR. Without them it runs
      # `npm run release`, which publishes one package at a time, dependencies first, each
      # confirmed readable on the registry before its dependents go out (see
      # scripts/publish-release.mjs for why).
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
          title: 'Release: Version Packages'
          commit: 'Version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

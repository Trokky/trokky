name: Changesets Release

on:
  push:
    branches:
      - main

concurrency:
  # Shared with manual-publish.yml so two publishes never race the registry.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          scope: '@trokky'
          cache: npm

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build Packages
        run: npm run build

      # Publishes to the `staged` dist-tag, never straight to `latest` — see the promote step.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
          title: 'Release: Version Packages'
          commit: 'Version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The half of the release that makes it visible to users.
      #
      # v3.2.0 is why this exists. `changeset publish` publishes concurrently with no dependency
      # ordering and reported success for all three packages when only one had landed, so
      # @trokky/studio went live depending on a @trokky/trokky that did not exist and could not
      # be installed at all. Publishing behind `staged` keeps `latest` on the last complete
      # release until every package is confirmed on the registry; this step then moves `latest`,
      # dependencies first. A failure here leaves users on the previous release rather than on a
      # broken one, and is fixed by re-running: changeset publish skips what is already there.
      - name: Verify on npm, then promote to latest
        if: steps.changesets.outputs.published == 'true'
        run: npm run promote-release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}

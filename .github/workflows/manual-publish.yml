name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - trokky
          - studio
          - client
      dry_run:
        description: 'Run npm publish with --dry-run (nothing is published)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  # Shared with release-changesets.yml so two publishes never race the registry.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@trokky'
          cache: npm

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Packages
        run: npm run build

      - name: Publish Selected Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          extra_args=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            extra_args+=(--dry-run)
          fi

          publish_workspace() {
            local dir="$1"
            local name version
            read -r name version < <(node -p "const p=require('./packages/${dir}/package.json'); p.name+' '+p.version")

            # Dry runs always exercise `npm publish --dry-run`; only real
            # publishes skip versions that are already on the registry.
            # GitHub Packages may answer an empty body for an unknown version, so
            # compare the returned version instead of trusting the exit status.
            if [ "$INPUT_DRY_RUN" != "true" ]; then
              local published
              published=$(npm view "${name}@${version}" version 2>/dev/null || true)
              if [ "$published" = "$version" ]; then
                echo "Skipping ${name}@${version}: already published."
                return 0
              fi
            fi

            echo "Publishing ${name}@${version}..."
            npm publish --workspace "packages/${dir}" --access restricted "${extra_args[@]+"${extra_args[@]}"}"
          }

          case "$INPUT_PACKAGE" in
            all)
              # Dependency order: trokky first, then its dependents.
              publish_workspace trokky
              publish_workspace client
              publish_workspace studio
              ;;
            trokky | studio | client)
              publish_workspace "$INPUT_PACKAGE"
              ;;
            *)
              echo "Unknown package: ${INPUT_PACKAGE}" >&2
              exit 1
              ;;
          esac

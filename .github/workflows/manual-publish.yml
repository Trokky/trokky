name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - trokky
          - studio
          - client
      dry_run:
        description: 'Run npm publish with --dry-run (nothing is published)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@trokky'
          cache: npm

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Packages
        run: npm run build

      - name: Publish Selected Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          extra_args=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            extra_args+=(--dry-run)
          fi

          publish_workspace() {
            local dir="$1"
            local name version
            name="$(node -p "require('./packages/${dir}/package.json').name")"
            version="$(node -p "require('./packages/${dir}/package.json').version")"

            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version}: already published."
              return 0
            fi

            echo "Publishing ${name}@${version}..."
            npm publish --workspace "packages/${dir}" --access restricted "${extra_args[@]+"${extra_args[@]}"}"
          }

          case "$INPUT_PACKAGE" in
            all)
              # Dependency order: trokky first, then its dependents.
              publish_workspace trokky
              publish_workspace client
              publish_workspace studio
              ;;
            trokky | studio | client)
              publish_workspace "$INPUT_PACKAGE"
              ;;
            *)
              echo "Unknown package: ${INPUT_PACKAGE}" >&2
              exit 1
              ;;
          esac
